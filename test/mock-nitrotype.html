<!doctype html>
<!--
  A stand-in for a Nitro Type race, used by test/e2e.mjs.
  Like the real thing it:
    - renders the text as .dash-letter spans (spaces as &nbsp;, a flag at the end)
    - marks the current letter .is-waiting and done letters .is-correct .is-typed
    - ignores keys during the countdown
    - ignores events whose isTrusted is false (keys and clicks)
    - stays on a letter after a wrong key (no backspace needed)
    - Enter at the start of a word uses a nitro: the word is skipped
    - shows a "Race Again" button after the finish that loads a new race
  Query params:
    listen=keypress|keydown|onkeypress|input   which event drives the race
    countdown=ms                               delay before "GO"
    nitros=N                                   nitros the player owns (default 3)
    again=none                                 no "Race Again" button (reload needed)
    frame=1                                    put the race inside an iframe
    rerender=1                                 mid-race, the letters vanish for a moment and come back as new elements
    inrace=1                                   first load shows the "Currently in a Race" popup; Try Again starts the race
    results=plain                              a plain results box instead of Nitro Type's results table
    state=none                                 no React fiber on #raceContainer (script must read the results screen)
    captcha=1                                  a captcha appears mid-race (the race freezes); clicks on it are counted in window.__captchaClicks
    levelup=1                                  each race levels you up (state + "Level Up!" on the results screen)
    season=1                                   each race unlocks a season pass tier
    dq=1 | dq=all                              the first race (or every race) ends in Nitro Type's "Disqualified!" popup
    loggedout=1                                the race state says you're logged out
    rewards=hidden                             no rewards box on the results screen (money/XP must come from totals)
    server=none                                no race-update events (money/XP must come from the saved state)
    afk=1                                      like Nitro Type (probably): the race loop runs on screen frames and
                                               progress goes to the "server" on a page timer; the server (its own
                                               worker, unaffected by the tab being hidden) disqualifies you for
                                               inactivity after 5 s with no progress reported
  Your account totals live in localStorage "persist:nt" (like Nitro Type) and
  arrive with the finishing race update as racer.rewards.current. The race
  track is a <canvas> in #raceContainer.
  Every page also has the always-on "protected by reCAPTCHA" badge, which must not count as a captcha.
  Like Nitro Type, #raceContainer's React fiber leads to the race component,
  whose state.racers holds every racer's progress and place. Three bots race
  too: Speedy (160 WPM), Cruiser (105) and Slowpoke (55).
  Page loads are counted in sessionStorage "mock-loads" (window.__loads), and
  clicks on a decoy "New Race" link in window.__decoyClicks.
  Results go to sessionStorage "mock-results" (survives reloads) and
  window.__results.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mock Nitro Type</title>
    <style>
      body { background: #1c2541; color: #8a97c2; font: 20px monospace; padding: 30px; }
      .dash-letter.is-correct { color: #fff; }
      .dash-letter.is-incorrect { color: #e5484d; }
      .dash-letter.is-waiting { background: #f5a623; color: #1c2541; }
      iframe { width: 1000px; height: 360px; border: 1px solid #2f3d68; }
      .dash-copy-input { position: absolute; opacity: 0; }
      button { font: inherit; margin-top: 12px; }
    </style>
  </head>
  <body>
    <script>
      const params = new URLSearchParams(location.search);
      if (params.get("frame") === "1") {
        params.delete("frame");
        document.write(`<p>Lobby page with the race in an iframe</p><iframe src="${location.pathname}?${params}"></iframe>`);
      } else {
        const TEXTS = [
          "The quick brown fox jumps over the lazy dog. Pack my box with five dozen liquor jugs! How vexingly quick daft zebras jump; sphinx of black quartz, judge my vow (42 times).",
          "Nothing in the world is worth having or worth doing unless it means effort, pain, difficulty. I have never in my life envied a human being who led an easy life.",
          "Typing quickly is a skill that improves with practice; accuracy matters more than raw speed when you are starting out, so slow down and build good habits first.",
        ];
        const listen = params.get("listen") || "keypress";
        const countdown = Number(params.get("countdown") ?? 1500);
        const noAgain = params.get("again") === "none";
        const plainResults = params.get("results") === "plain";
        let nitrosLeft = Number(params.get("nitros") ?? 3);
        const loads = Number(sessionStorage.getItem("mock-loads") || 0) + 1;
        sessionStorage.setItem("mock-loads", String(loads));
        window.__loads = loads;
        window.__decoyClicks = 0;
        const rerender = params.get("rerender") === "1";
        const stored = JSON.parse(sessionStorage.getItem("mock-results") || "[]");
        window.__results = stored;
        let raceNo = stored.length;
        let untrusted = 0;
        let earlyKeys = 0;

        // A site menu link that must never be clicked by the script.
        document.write(`<nav><a href="#" class="decoy" onclick="event.preventDefault(); window.__decoyClicks++">New Race</a></nav>`);
        // Like Nitro Type's header: WPM and accuracy that are NOT race results.
        document.write(`<div class="profile-stats"><span>Avg Speed</span> <b>88 WPM</b> <span>Acc</span> <b>96%</b></div>`);
        document.write(`<div id="raceContainer"><canvas class="race-track" width="1024" height="220" style="display:block;width:100%;height:220px;background:#0b1020"></canvas><div class="dash"><div class="dash-copy"></div><input class="dash-copy-input" autocomplete="off"></div><div id="after"></div></div>`);
        const raceContainer = document.getElementById("raceContainer");
        const copy = document.querySelector(".dash-copy");

        // The React side: #raceContainer -> fiber -> race component.
        const ME = 7;
        const BOTS = [
          { userID: 101, name: "Speedy", wpm: 160 },
          { userID: 102, name: "Cruiser", wpm: 105 },
          { userID: 103, name: "Slowpoke", wpm: 55 },
        ];
        const comp = { state: { racers: [], lessonContent: "" }, props: { user: { userID: ME, loggedIn: params.get("loggedout") !== "1", level: 11, seasonLevel: 4 } } };
        window.__garageClicks = 0;
        // The always-on reCAPTCHA v3 badge: not a captcha to solve.
        document.write(`<iframe class="grecaptcha-badge" src="about:blank#https://www.google.com/recaptcha/api2/anchor?k=x&size=invisible" width="256" height="60" style="position:fixed;right:0;bottom:0;border:0"></iframe>`);
        window.__captchaClicks = 0;
        window.__comp = comp;
        // Nitro Type's race server: an event emitter ("update" etc.).
        const listeners = {};
        if (params.get("server") !== "none") {
          comp.server = {
            on(event, fn) {
              (listeners[event] ||= []).push(fn);
            },
          };
        }
        const emit = (event, payload) => (listeners[event] || []).forEach((fn) => fn(payload));
        // Your account totals, saved like Nitro Type does.
        if (!localStorage.getItem("persist:nt")) {
          localStorage.setItem("persist:nt", JSON.stringify({ user: JSON.stringify({ money: 50000, experience: 120000, level: 11 }) }));
        }
        const savedUser = () => JSON.parse(JSON.parse(localStorage.getItem("persist:nt")).user);
        if (params.get("state") !== "none") {
          raceContainer.__reactFiber$mock = { type: "div", return: { type: "div", return: { type: function RaceContainer() {}, stateNode: comp } } };
        }
        const me = () => comp.state.racers.find((x) => x.userID === ME);
        let finishOrder = 0;
        let botTimer = 0;
        const input = document.querySelector(".dash-copy-input");
        const after = document.getElementById("after");
        let race = null;

        function newRace() {
          const text = TEXTS[raceNo % TEXTS.length];
          raceNo++;
          copy.replaceChildren();
          after.replaceChildren();
          const spans = [];
          for (const word of text.split(/(?<= )/)) {
            const w = document.createElement("span");
            w.className = "dash-word";
            for (const ch of word) {
              const s = document.createElement("span");
              s.className = "dash-letter";
              s.textContent = ch === " " ? " " : ch;
              w.appendChild(s);
              spans.push(s);
            }
            copy.appendChild(w);
          }
          const flag = document.createElement("span");
          flag.className = "dash-letter";
          flag.textContent = "🏁";
          copy.appendChild(flag);
          spans[0].classList.add("is-waiting");
          race = { text, spans, pos: 0, started: false, startedAt: 0, correct: 0, wrong: 0, nitroWords: [] };
          const r = race;
          const fresh = () => ({ typed: 0, skipped: 0, errors: 0, startStamp: 0, completeStamp: 0 });
          comp.state.lessonContent = text;
          comp.state.racers = [
            { userID: ME, lane: 2, profile: { displayName: "Me Myself", username: "me" }, progress: fresh() },
            ...BOTS.map((b, i) => ({ userID: b.userID, lane: [0, 1, 3][i], robot: true, profile: { displayName: b.name }, progress: fresh(), botWpm: b.wpm })),
          ];
          finishOrder = 0;
          clearInterval(botTimer);
          setTimeout(() => {
            r.started = true;
            r.startedAt = performance.now();
            for (const x of comp.state.racers) x.progress.startStamp = Date.now();
            // Bots move along at their own speed and finish in order.
            botTimer = setInterval(() => {
              for (const b of comp.state.racers) {
                if (!b.robot || b.progress.completeStamp) continue;
                const elapsed = (Date.now() - b.progress.startStamp) / 60000;
                b.progress.typed = Math.min(text.length, Math.floor(b.botWpm * 5 * elapsed));
                if (b.progress.typed >= text.length) {
                  b.progress.completeStamp = Date.now();
                  b.place = ++finishOrder;
                }
              }
              emit("update", { racers: comp.state.racers });
            }, 200);
          }, countdown);
          input.focus();
        }

        function moveTo(pos) {
          const r = race;
          me().progress.typed += pos - r.pos;
          const dqMode = params.get("dq");
          if (dqMode && !r.dq && pos >= 40 && (dqMode === "all" || !sessionStorage.getItem("mock-dq-done"))) {
            // Nitro Type's popup: the race is over for you.
            r.dq = true;
            r.dead = true;
            sessionStorage.setItem("mock-dq-done", "1");
            document.body.insertAdjacentHTML(
              "beforeend",
              `<div class="modal modal--raceError" id="dq"><h2>Disqualified!</h2><p>Uh oh! You have been disqualified due to inactivity.</p>
                 <button class="garage">Go To Your Garage</button><button class="again">Race Again</button></div>`,
            );
            const box = document.getElementById("dq");
            box.querySelector(".garage").addEventListener("click", () => window.__garageClicks++);
            box.querySelector(".again").addEventListener("click", (e) => {
              if (!e.isTrusted) return void untrusted++;
              box.remove();
              setTimeout(newRace, 300);
            });
          }
          if (params.get("captcha") === "1" && !r.captcha && pos >= 50) {
            // A captcha takes over: the race freezes until it's solved.
            r.captcha = true;
            r.dead = true;
            document.body.insertAdjacentHTML(
              "beforeend",
              `<div class="captcha-modal"><iframe src="about:blank#https://www.google.com/recaptcha/api2/anchor?k=x&size=normal" width="304" height="78"></iframe>
                 <div class="fake-check" role="checkbox">I'm not a robot</div></div>`,
            );
            const box = document.querySelector(".captcha-modal");
            for (const t of ["pointerdown", "mousedown", "click"]) box.addEventListener(t, () => window.__captchaClicks++, true);
          }
          for (let i = r.pos; i < pos; i++) r.spans[i].className = "dash-letter is-correct is-typed";
          r.pos = pos;
          if (pos < r.text.length) r.spans[pos].classList.add("is-waiting");
          else finish();
          if (rerender && !r.rerendered && pos >= 40 && pos < r.text.length) {
            r.rerendered = true;
            const words = [...copy.childNodes];
            copy.replaceChildren(); // gone for a moment...
            setTimeout(() => {
              // ...then back, as brand-new elements with the same classes.
              const fresh = words.map((w) => w.cloneNode(true));
              copy.replaceChildren(...fresh);
              r.spans = [...copy.querySelectorAll(".dash-letter")].slice(0, r.text.length);
            }, 600);
          }
        }

        function type(ch, isTrusted) {
          const r = race;
          if (!isTrusted) return void untrusted++;
          if (!r.started) return void earlyKeys++;
          if (r.pos >= r.text.length || r.dead || r.spans[r.pos]?.isConnected === false) return;
          if (ch === r.text[r.pos]) {
            r.correct++;
            moveTo(r.pos + 1);
          } else {
            r.wrong++;
            me().progress.errors++;
            r.spans[r.pos].classList.add("is-incorrect");
          }
        }

        function nitro(isTrusted) {
          const r = race;
          if (!isTrusted || !r.started || r.pos >= r.text.length) return;
          const atWordStart = r.pos === 0 || r.text[r.pos - 1] === " ";
          if (!atWordStart || nitrosLeft <= 0) return;
          nitrosLeft--;
          let end = r.pos;
          while (end < r.text.length && r.text[end] !== " ") end++;
          r.nitroWords.push(r.text.slice(r.pos, end));
          const to = Math.min(r.text.length, end + 1);
          me().progress.skipped += to - r.pos;
          moveTo(to);
        }

        function finish() {
          const r = race;
          const minutes = (performance.now() - r.startedAt) / 60000;
          const result = {
            wpm: r.text.length / 5 / minutes,
            accuracy: (100 * r.correct) / (r.correct + r.wrong),
            correct: r.correct,
            wrong: r.wrong,
            untrusted,
            earlyKeys,
            nitroWords: r.nitroWords,
          };
          window.__results.push(result);
          sessionStorage.setItem("mock-results", JSON.stringify(window.__results));
          // Official numbers, Nitro Type's way, from the race state.
          const self = me();
          const p = self.progress;
          p.completeStamp = Date.now();
          self.place = ++finishOrder;
          const net = p.typed - p.skipped;
          const offWpm = Math.round(net / 5 / ((p.completeStamp - p.startStamp) / 60000));
          const offAcc = Math.round((1 - p.errors / net) * 1000) / 10;
          const place = self.place;
          const money = 1200 + raceNo;
          const xp = 500 + raceNo;
          const user = comp.props.user;
          const extras = [];
          if (params.get("levelup") === "1") {
            user.level++;
            extras.push(`<div class="levelUp">Level Up! You reached level ${user.level}</div>`);
          }
          if (params.get("season") === "1") {
            user.seasonLevel++;
            extras.push(`<div class="seasonReward">Season Reward Unlocked · Tier ${user.seasonLevel}</div>`);
          }
          result.shown_level = user.level;
          // Updated totals: with the finishing race update right away, and in
          // the saved state a moment later.
          const totals = savedUser();
          const current = { money: totals.money + money, experience: totals.experience + xp, level: user.level };
          if (params.get("server") !== "none") {
            self.rewards = { current };
            emit("update", { racers: comp.state.racers });
          }
          setTimeout(() => localStorage.setItem("persist:nt", JSON.stringify({ user: JSON.stringify(current) })), 1500);
          result.shown_season = user.seasonLevel;
          // The results table: finishers by place, then everyone else.
          const rows = comp.state.racers
            .map((x) => {
              const xp2 = x.progress;
              const mins = ((xp2.completeStamp || Date.now()) - xp2.startStamp) / 60000;
              return {
                name: x.userID === ME ? "Me Myself" : x.profile.displayName,
                self: x.userID === ME,
                place: x.place ?? 99,
                wpm: x.userID === ME ? offWpm : Math.round(xp2.typed / 5 / mins),
                acc: x.userID === ME ? offAcc : 100,
              };
            })
            .sort((a, b) => a.place - b.place);
          result.shown = { place, wpm: offWpm, accuracy: offAcc, money, xp, names: rows.map((x) => x.name) };
          sessionStorage.setItem("mock-results", JSON.stringify(window.__results));
          const suffix = (n) => (["st", "nd", "rd"][n - 1] ?? "th");
          const box = document.createElement("div");
          box.className = "race-results";
          box.innerHTML = plainResults
            ? `<div class="place"><b>${place}</b><sup>${suffix(place)}</sup> Place</div>
               <div class="stat"><span class="v">${offWpm}</span> <span class="k">WPM</span></div>
               <div class="stat"><span class="v">${offAcc.toFixed(1)}%</span> <span class="k">Accuracy</span></div>
               <div class="stat"><span class="v">$${money.toLocaleString()}</span> <span class="k">Money</span></div>
               <div class="stat"><span class="v">+${xp}</span> <span class="k">XP</span></div>`
            : `<div class="raceResults raceResults--default">
                 <div class="raceResults-header">Race Results</div>
                 <div class="raceResults-body"><div class="gridTable gridTable--raceResults">${rows
                   .map(
                     (row, i) => `<div class="gridTable-row${row.self ? " is-self" : ""}">
                       <div class="gridTable-cell">${i + 1}<sup>${suffix(i + 1)}</sup></div>
                       <div class="gridTable-cell">${row.name}</div>
                       <div class="gridTable-cell gridTable-cell--end"><span>${row.wpm} WPM</span> <span>${row.acc.toFixed(1)}% Acc</span></div>
                     </div>`,
                   )
                   .join("")}</div></div>
                 ${params.get("rewards") === "hidden" ? "" : `<div class="raceResults-rewards"><div>Money Earned</div><div>$${money.toLocaleString()}</div><div>Experience</div><div>+${xp} XP</div></div>`}
                 ${extras.join("")}
               </div>`;
          setTimeout(() => after.prepend(box), 600);
          if (!noAgain) {
            const btn = document.createElement("button");
            btn.textContent = "Race Again";
            btn.addEventListener("click", (e) => {
              if (!e.isTrusted) return void untrusted++;
              setTimeout(newRace, 300);
            });
            after.appendChild(btn);
          }
        }

        if (listen === "keypress") document.addEventListener("keypress", (e) => e.key !== "Enter" && type(e.key, e.isTrusted));
        if (listen === "keydown") document.addEventListener("keydown", (e) => e.key.length === 1 && type(e.key, e.isTrusted));
        if (listen === "onkeypress") document.onkeypress = (e) => e.charCode !== 13 && type(String.fromCharCode(e.charCode), e.isTrusted);
        if (listen === "input") {
          input.addEventListener("input", (e) => {
            type(e.data, e.isTrusted);
            input.value = "";
          });
        }
        document.addEventListener("keydown", (e) => e.key === "Enter" && nitro(e.isTrusted));

        // The page's own synthetic events must stay untrusted.
        const probe = new KeyboardEvent("keydown", { key: "F9" });
        document.addEventListener("keydown", function check(e) {
          if (e.key === "F9") window.__pageEventTrusted = e.isTrusted;
          document.removeEventListener("keydown", check);
        });
        document.dispatchEvent(probe);

        if (params.get("afk") === "1") {
          let framePos = 0;
          let lastSent = Date.now();
          let sentPos = 0;
          window.__afkDq = false;
          // The race loop: runs on screen frames (stops when the tab is hidden).
          const frame = () => {
            if (race) framePos = race.pos;
            requestAnimationFrame(frame);
          };
          requestAnimationFrame(frame);
          // Progress to the server: on a page timer (slowed when hidden).
          setInterval(() => {
            if (framePos !== sentPos) {
              sentPos = framePos;
              lastSent = Date.now();
            }
          }, 300);
          // The server's inactivity check: not affected by the tab at all.
          const server = new Worker(URL.createObjectURL(new Blob(["setInterval(() => postMessage(0), 300)"], { type: "text/javascript" })));
          server.onmessage = () => {
            const r = race;
            if (!r || !r.started || r.dead || r.pos >= r.text.length) {
              lastSent = Date.now();
              return;
            }
            if (Date.now() - lastSent > 5000) {
              r.dead = true;
              window.__afkDq = true;
              document.body.insertAdjacentHTML(
                "beforeend",
                `<div class="modal modal--raceError" id="afkdq"><h2>Disqualified!</h2><p>Uh oh! You have been disqualified due to inactivity.</p><button class="garage">Go To Your Garage</button></div>`,
              );
            }
          };
        }

        if (params.get("inrace") === "1" && !sessionStorage.getItem("mock-inrace-done")) {
          document.body.insertAdjacentHTML(
            "beforeend",
            `<div class="modal modal--error" id="inrace"><h2>Currently in a Race</h2>
              <p>You are currently engaged in an active race. You must wait a moment until you are disqualified from that race before you can continue.</p>
              <button class="garage">Go To Your Garage</button><button class="retry">Try Again</button></div>`,
          );
          window.__garageClicks = 0;
          document.querySelector("#inrace .garage").addEventListener("click", () => window.__garageClicks++);
          document.querySelector("#inrace .retry").addEventListener("click", (e) => {
            if (!e.isTrusted) return void untrusted++;
            sessionStorage.setItem("mock-inrace-done", "1");
            document.getElementById("inrace").remove();
            newRace();
          });
        } else {
          newRace();
        }
      }
    </script>
  </body>
</html>
