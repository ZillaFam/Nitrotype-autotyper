<!doctype html>
<!--
  A stand-in for Monkeytype's typing test, used by test/e2e.mjs.
  It copies the parts of Monkeytype the extension depends on (taken from
  frontend/src/ts/input/* and components/pages/test/Word*.tsx upstream):
    - <textarea id="wordsInput"> whose value is " " + current word input
    - #words > .word[data-wordindex] (.active on the current word) > <letter>
    - beforeinput can cancel; input handlers are async; the handler, not the
      browser, resets the value when moving to the next word
  Query params: ?words=N  &typos=replace  &stopOnError=letter
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mock Monkeytype</title>
    <style>
      body { background: #323437; color: #646669; font: 24px monospace; padding: 40px; }
      #words { display: flex; flex-wrap: wrap; gap: 0 0.6em; max-width: 900px; }
      letter.correct { color: #d1d0c5; }
      letter.incorrect { color: #ca4754; }
      .word.active { text-decoration: underline; }
      #wordsInput { position: absolute; opacity: 0; width: 0; height: 1em; }
      #result[hidden] { display: none; }
    </style>
  </head>
  <body>
    <textarea id="wordsInput" autocomplete="off"></textarea>
    <div id="words"></div>
    <pre id="result" hidden></pre>
    <script>
      const params = new URLSearchParams(location.search);
      const WORDS = [
        "the", "quick", "brown", "fox", "jumps", "over", "lazy", "dog", "while",
        "people", "never", "Think", "about", "world,", "because", "it's", "late.",
        "keyboard", "monkey", "type", "faster", "than", "light", "every", "day",
      ];
      const count = Number(params.get("words") || 25);
      const words = Array.from({ length: count }, (_, i) => WORDS[i % WORDS.length]);
      const replaceTypos = params.get("typos") === "replace";
      const stopOnLetter = params.get("stopOnError") === "letter";

      const input = document.getElementById("wordsInput");
      const wordsEl = document.getElementById("words");
      const inputs = words.map(() => "");
      let active = 0;
      let startedAt = null;
      let correctKeys = 0;
      let wrongKeys = 0;
      let finished = false;
      const keydowns = [];

      input.value = " ";
      const current = () => input.value.slice(1);

      function render(i) {
        const el = wordsEl.children[i];
        const target = words[i];
        const typed = inputs[i];
        el.classList.toggle("active", i === active);
        el.replaceChildren();
        const len = Math.max(target.length, typed.length);
        for (let c = 0; c < len; c++) {
          const letter = document.createElement("letter");
          if (c >= target.length) {
            letter.className = "incorrect extra";
            letter.textContent = typed[c];
          } else if (c < typed.length) {
            const ok = typed[c] === target[c];
            letter.className = ok ? "correct" : "incorrect";
            letter.textContent = !ok && replaceTypos ? typed[c] : target[c];
          } else {
            letter.textContent = target[c];
          }
          el.appendChild(letter);
        }
      }

      words.forEach((_, i) => {
        const el = document.createElement("div");
        el.className = "word";
        el.dataset.wordindex = String(i);
        wordsEl.appendChild(el);
        render(i);
      });

      function finish() {
        finished = true;
        const minutes = (performance.now() - startedAt) / 60000;
        const correctChars = words.join(" ").length;
        const result = {
          wpm: correctChars / 5 / minutes,
          accuracy: (100 * correctKeys) / (correctKeys + wrongKeys),
          correctKeys,
          wrongKeys,
          allCorrect: inputs.every((t, i) => t === words[i]),
          keydowns: keydowns.length,
        };
        window.__result = result;
        wordsEl.style.display = "none";
        input.remove();
        const pre = document.getElementById("result");
        pre.hidden = false;
        pre.textContent = JSON.stringify(result, null, 2);
      }

      input.addEventListener("keydown", (e) => keydowns.push(e.code));

      input.addEventListener("beforeinput", (e) => {
        if (finished) return e.preventDefault();
        if (e.inputType === "insertText" && e.data === " " && current() === "") {
          e.preventDefault(); // no leading space
        }
        if (e.inputType === "deleteContentBackward" && current() === "") {
          e.preventDefault(); // (simplified) no going back to the previous word
        }
      });

      input.addEventListener("input", async (e) => {
        await Promise.resolve(); // Monkeytype's handlers are async
        if (e.inputType === "insertText") {
          startedAt ??= performance.now();
          const before = current().slice(0, -1);
          const target = words[active];
          if (e.data === " ") {
            const ok = before === target;
            ok ? correctKeys++ : wrongKeys++;
            inputs[active] = before;
            active++;
            input.value = " ";
            render(active - 1);
            render(active);
            return;
          }
          const ok = e.data === target[before.length];
          ok ? correctKeys++ : wrongKeys++;
          if (!ok && stopOnLetter) {
            input.value = " " + before; // stop on error: the key is rejected
          }
          inputs[active] = current();
          render(active);
          if (active === words.length - 1 && inputs[active] === target) finish();
        } else if (e.inputType === "deleteContentBackward") {
          inputs[active] = current();
          render(active);
        }
      });
    </script>
  </body>
</html>
